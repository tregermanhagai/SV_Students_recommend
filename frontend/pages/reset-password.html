<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – SV Students Recommend</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="../assets/SVCollege_logo.png" type="image/png" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="login.html">
        <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
      </a>
      <h2>Set New Password</h2>
      <p>SV Students Recommend</p>
    </div>

    <div class="alert alert-error"   id="errorMsg"   data-test="error-message"></div>
    <div class="alert alert-success" id="successMsg" data-test="success-message"></div>

    <form id="resetForm" data-test="form-reset" novalidate>
      <div class="form-group">
        <label for="newPassword">New Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input type="password" id="newPassword" class="form-control"
                 placeholder="Minimum 4 English characters"
                 autocomplete="new-password" data-test="input-new-password" required />
          <button type="button" class="btn-eye" data-test="btn-toggle-password"></button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" class="form-control"
                 placeholder="Repeat your new password"
                 autocomplete="new-password" data-test="input-confirm-password" required />
          <button type="button" class="btn-eye" data-test="btn-toggle-confirm-password"></button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" data-test="btn-reset-password">
        Set New Password
      </button>
    </form>

    <p style="text-align:center; margin-top:16px; font-size:0.9rem; color:var(--text-muted)">
      <a href="login.html" data-test="link-back-login">Back to login</a>
    </p>
  </div>
</div>

<footer class="site-footer" data-test="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <a href="https://svcollege.co.il/" target="_blank" rel="noopener noreferrer"><img src="../assets/SVCollege_logo.png" alt="SV College" class="footer-logo-img" /></a>
      <span>SV College</span>
    </div>
    <p class="footer-copy">&copy; 2026 All rights reserved.</p>
    <a href="../accessibility.html" class="footer-accessibility" title="Accessibility Statement" data-test="link-accessibility">
      <i class="fas fa-universal-access"></i>
      <span>Accessibility</span>
    </a>
  </div>
</footer>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
