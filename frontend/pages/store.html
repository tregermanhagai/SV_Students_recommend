<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store - SV Students Recommend</title>
    <link rel="stylesheet" href="../assets/style.css?v=3" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" href="../assets/SVCollege_logo.png" type="image/png" />
</head>

<body>

    <header class="global-header">
        <a class="header-logo" href="home.html">
            <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
            <span>SV Recommend</span>
        </a>
        <nav class="header-nav">
            <a class="nav-link" href="home.html" data-test="nav-home">Home</a>
            <a class="nav-link" href="profile.html" data-test="nav-profile">My Profile</a>
            <a class="nav-link" href="admin.html" id="navSystem" data-test="nav-system" style="display:none">System</a>
            <a class="nav-link nav-cart" href="cart.html" id="navCart" data-test="nav-cart" style="display:none">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge" data-test="cart-badge">0</span>
            </a>
            <a class="nav-link" href="#" id="btnLogout" data-test="nav-logout">Logout</a>
            <a class="btn-accent" href="add-recommendation.html" data-test="nav-signup-recommendations">+ Add
                Recommendation</a>
        </nav>
    </header>

    <main class="container" data-test="section-store">
        <h2 style="color:var(--primary)">SV College Store</h2>
        <p style="margin-top:6px;color:var(--text-muted)">Practice checkout flow for branded college merchandise.</p>

        <section class="product-grid" style="margin-top:20px">
            <article class="product-card card" data-test="product-card-tshirt">
                <div class="product-img-wrap card-image-wrap">
                    <img src="../assets/SV_shirt.png" alt="SV T-Shirt" loading="lazy" />
                </div>
                <div class="product-card-body card-body">
                    <h3 class="product-name card-title">T-Shirt with SV College Logo</h3>
                    <div class="price-badge">50 NIS</div>
                    <button class="btn btn-primary" type="button" data-test="btn-add-tshirt"
                        data-product="tshirt">Add to cart</button>
                </div>
            </article>

            <article class="product-card card" data-test="product-card-cup">
                <div class="product-img-wrap card-image-wrap">
                    <img src="../assets/SV_cup.png" alt="SV Cup" loading="lazy" />
                </div>
                <div class="product-card-body card-body">
                    <h3 class="product-name card-title">Cup with SV College Logo</h3>
                    <div class="price-badge">20 NIS</div>
                    <button class="btn btn-primary" type="button" data-test="btn-add-cup"
                        data-product="cup">Add to cart</button>
                </div>
            </article>
        </section>
    </main>

    <footer class="site-footer" data-test="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <a href="https://svcollege.co.il/" target="_blank" rel="noopener noreferrer"><img src="../assets/SVCollege_logo.png" alt="SV College" class="footer-logo-img" /></a>
          <span>SV College</span>
        </div>
        <p class="footer-copy">&copy; 2026 All rights reserved.</p>
        <a href="../accessibility.html" class="footer-accessibility" title="Accessibility Statement" data-test="link-accessibility">
          <i class="fas fa-universal-access"></i>
          <span>Accessibility</span>
        </a>
      </div>
    </footer>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/store.js?v=3"></script>
</body>

</html>
