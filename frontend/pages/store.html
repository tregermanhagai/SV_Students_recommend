<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store - SV Students Recommend</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="icon" href="../assets/SVCollege_logo.png" type="image/png" />
</head>

<body>

    <header class="global-header">
        <a class="header-logo" href="home.html">
            <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
            <span>SV Recommend</span>
        </a>
        <nav class="header-nav">
            <a class="nav-link" href="home.html" data-test="nav-home">Home</a>
            <a class="nav-link" href="profile.html" data-test="nav-profile">My Profile</a>
            <a class="nav-link" href="#" id="btnLogout" data-test="nav-logout">Logout</a>
            <a class="btn-accent" href="add-recommendation.html" data-test="nav-signup-recommendations">+ Add
                Recommendation</a>
        </nav>
    </header>

    <main class="container" data-test="section-store">
        <h2 style="color:var(--primary)">SV College Store</h2>
        <p style="margin-top:6px;color:var(--text-muted)">Practice checkout flow for branded college merchandise.</p>

        <section class="product-grid" style="margin-top:20px">
            <article class="product-card card" data-test="product-card-tshirt">
                <div class="product-img-wrap card-image-wrap">
                    <img src="../assets/SV_shirt.png" alt="SV T-Shirt" loading="lazy" />
                </div>
                <div class="product-card-body card-body">
                    <h3 class="product-name card-title">T-Shirt with SV College Logo</h3>
                    <div class="price-badge">50 NIS</div>
                    <button class="btn btn-primary" type="button" data-test="btn-select-tshirt"
                        data-product="tshirt">Select</button>
                </div>
            </article>

            <article class="product-card card" data-test="product-card-cup">
                <div class="product-img-wrap card-image-wrap">
                    <img src="../assets/SV_cup.png" alt="SV Cup" loading="lazy" />
                </div>
                <div class="product-card-body card-body">
                    <h3 class="product-name card-title">Cup with SV College Logo</h3>
                    <div class="price-badge">20 NIS</div>
                    <button class="btn btn-primary" type="button" data-test="btn-select-cup"
                        data-product="cup">Select</button>
                </div>
            </article>
        </section>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/store.js"></script>
</body>

</html>
