<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - SV Students Recommend</title>
    <link rel="stylesheet" href="../assets/style.css?v=3" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" href="../assets/SVCollege_logo.png" type="image/png" />
</head>

<body>

    <header class="global-header">
        <a class="header-logo" href="home.html">
            <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
            <span>SV Recommend</span> <i class="fas fa-house" style="font-size:14px;margin-left:6px;opacity:0.7;"></i>
        </a>
        <nav class="header-nav">
            <a class="nav-link" href="profile.html" data-test="nav-profile">My Profile</a>
            <a class="nav-link" href="admin.html" id="navSystem" data-test="nav-system" style="display:none">System</a>
            <a class="nav-link nav-cart" href="cart.html" id="navCart" data-test="nav-cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge" data-test="cart-badge">0</span>
            </a>
            <a class="nav-link" href="#" id="btnLogout" data-test="nav-logout">Logout</a>
            <a class="btn-accent" href="add-recommendation.html" data-test="nav-signup-recommendations">+ Add
                Recommendation</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-card cart-box">
            <h2>Your Cart</h2>

            <div class="alert alert-error" id="cartError"></div>

            <!-- Empty state -->
            <div id="cartEmpty" style="display:none">
                <p style="color:var(--text-muted);text-align:center;padding:24px 0" data-test="cart-empty">
                    Your cart is empty.
                </p>
                <a href="store.html" class="btn btn-secondary" style="display:block;text-align:center"
                    data-test="link-back-store">&#8592; Back to Store</a>
            </div>

            <!-- Cart content -->
            <div id="cartContent" style="display:none">
                <div id="cartItemsList" data-test="cart-items-list"></div>

                <div class="order-summary-box" style="margin-top:18px">
                    <div class="order-row total">
                        <span>Grand Total</span>
                        <strong id="cartGrandTotal" data-test="cart-total">0 NIS</strong>
                    </div>
                </div>

                <div class="form-actions" style="margin-top:6px">
                    <a href="store.html" class="btn btn-secondary" style="width:auto" data-test="link-back-store">&#8592;
                        Back to Store</a>
                    <button type="button" class="btn btn-primary" id="btnProceedPayment"
                        data-test="btn-proceed-payment">Proceed to Payment</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" data-test="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <a href="https://svcollege.co.il/" target="_blank" rel="noopener noreferrer"><img src="../assets/SVCollege_logo.png" alt="SV College" class="footer-logo-img" /></a>
          <span>SV College</span>
        </div>
        <p class="footer-copy">&copy; 2026 All rights reserved.</p>
        <a href="../accessibility.html" class="footer-accessibility" title="Accessibility Statement" data-test="link-accessibility">
          <i class="fas fa-universal-access"></i>
          <span>Accessibility</span>
        </a>
      </div>
    </footer>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/cart.js?v=3"></script>
</body>

</html>
