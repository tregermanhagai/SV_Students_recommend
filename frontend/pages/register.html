<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – SV Students Recommend</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="login.html">
        <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
      </a>
      <h2>Create Account</h2>
      <p>SV Students Recommend</p>
    </div>

    <div class="alert alert-error"  id="errorMsg"   data-test="error-message"></div>
    <div class="alert alert-success" id="successMsg" data-test="success-message"></div>

    <form id="registerForm" data-test="form-register" novalidate>
      <div class="form-group">
        <label for="name">Student Name <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          class="form-control"
          placeholder="Your full name"
          autocomplete="name"
          data-test="input-name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
          data-test="input-email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Minimum 4 English characters"
          autocomplete="new-password"
          data-test="input-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" data-test="btn-register">
        Create Account
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <button class="btn btn-google" id="btnGoogleRegister" data-test="btn-google-register" type="button">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Continue with Google
    </button>

    <p style="text-align:center; margin-top:16px; font-size:0.9rem; color:var(--text-muted)">
      Already have an account?
      <a href="login.html" data-test="link-login">Sign in</a>
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
