<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – SV Students Recommend</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="../assets/SVCollege_logo.png" type="image/png" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
      <h2>Welcome</h2>
      <p>SV Students Recommend</p>
    </div>

    <div class="alert alert-success" id="registeredBanner" data-test="registered-banner"></div>
    <div class="alert alert-error"   id="errorMsg"         data-test="error-message"></div>

    <form id="loginForm" data-test="form-login" novalidate>
      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
          data-test="input-email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Your password"
            autocomplete="current-password"
            data-test="input-password"
            required
          />
          <button type="button" class="btn-eye" data-test="btn-toggle-password"></button>
        </div>
        <a href="#" id="linkForgotPassword" data-test="link-forgot-password"
           style="font-size:0.83rem; float:right; margin-top:4px">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" data-test="btn-login" style="margin-top:8px">
        Sign In
      </button>
    </form>

    <!-- Inline forgot-password panel -->
    <div id="forgotPanel" data-test="forgot-panel"
         style="display:none; margin-top:16px; padding:14px 16px; border:1.5px solid var(--border);
                border-radius:8px; background:#f8f9fa">
      <p style="margin:0 0 10px; font-weight:600">Reset your password</p>
      <input type="email" id="forgotEmail" class="form-control" placeholder="your@email.com"
             data-test="input-forgot-email" style="margin-bottom:10px" />
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn btn-primary" id="btnSendReset" data-test="btn-send-reset"
                style="width:auto; padding:8px 18px">Send reset link</button>
        <button class="btn btn-secondary" id="btnCancelReset" data-test="btn-cancel-reset"
                style="width:auto; padding:8px 18px">Cancel</button>
      </div>
      <div id="forgotMsg" data-test="forgot-message" style="margin-top:10px; font-size:0.88rem"></div>
    </div>

    <div class="divider"><span>or</span></div>

    <button class="btn btn-google" id="btnGoogleLogin" data-test="btn-google-login" type="button">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Continue with Google
    </button>

    <p style="text-align:center; margin-top:16px; font-size:0.9rem; color:var(--text-muted)">
      Don't have an account?
      <a href="register.html" data-test="link-register">Register here</a>
    </p>
  </div>
</div>

<footer class="site-footer" data-test="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <a href="https://svcollege.co.il/" target="_blank" rel="noopener noreferrer"><img src="../assets/SVCollege_logo.png" alt="SV College" class="footer-logo-img" /></a>
      <span>SV College</span>
    </div>
    <p class="footer-copy">&copy; 2026 All rights reserved.</p>
    <a href="../accessibility.html" class="footer-accessibility" title="Accessibility Statement" data-test="link-accessibility">
      <i class="fas fa-universal-access"></i>
      <span>Accessibility</span>
    </a>
  </div>
</footer>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
