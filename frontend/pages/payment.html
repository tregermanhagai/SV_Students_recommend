<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment - SV Students Recommend</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" href="../assets/SVCollege_logo.png" type="image/png" />
</head>

<body>

    <header class="global-header">
        <a class="header-logo" href="home.html">
            <img src="../assets/SVCollege_logo.png" alt="SV College" data-test="logo-svcollege" />
            <span>SV Recommend</span>
        </a>
        <nav class="header-nav">
            <a class="nav-link" href="home.html" data-test="nav-home">Home</a>
            <a class="nav-link" href="profile.html" data-test="nav-profile">My Profile</a>
            <a class="nav-link" href="admin.html" id="navSystem" data-test="nav-system" style="display:none">System</a>
            <a class="nav-link" href="#" id="btnLogout" data-test="nav-logout">Logout</a>
            <a class="btn-accent" href="add-recommendation.html" data-test="nav-signup-recommendations">+ Add
                Recommendation</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-card" style="max-width:680px">
            <h2>Payment</h2>

            <section class="order-summary-box" data-test="order-summary">
                <h3>Order Summary</h3>
                <div class="order-row"><span>Product</span><span id="summaryProduct">-</span></div>
                <div class="order-row"><span>Quantity</span><span id="summaryQuantity">-</span></div>
                <div class="order-row" id="summarySizeRow" style="display:none"><span>Size</span><span
                        id="summarySize">-</span></div>
                <div class="order-row total"><span>Total</span><strong id="summaryTotal">0 NIS</strong></div>
            </section>

            <div class="alert alert-error" id="paymentError"></div>
            <div class="alert alert-success" id="paymentSuccess" data-test="order-success-message"></div>

            <form id="paymentForm" data-test="form-payment" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input id="fullName" class="form-control" type="text" required data-test="input-full-name" />
                </div>

                <div class="form-group">
                    <label for="address">Address <span class="required">*</span></label>
                    <input id="address" class="form-control" type="text" required data-test="input-address" />
                </div>

                <div class="form-group">
                    <label for="cardNumber">Credit Card Number <span class="required">*</span></label>
                    <input id="cardNumber" class="form-control" type="tel" inputmode="numeric" maxlength="19"
                        placeholder="1234 5678 9012 3456" required data-test="input-card-number" />
                </div>

                <div class="form-group">
                    <label for="cvv">CVV / Secret Code <span class="required">*</span></label>
                    <input id="cvv" class="form-control" type="tel" inputmode="numeric" maxlength="4" placeholder="123"
                        required data-test="input-cvv" />
                </div>

                <div class="form-group">
                    <label for="expiry">Expiration Date <span class="required">*</span></label>
                    <input id="expiry" class="form-control" type="month" required data-test="input-expiry" />
                </div>

                <button type="submit" class="btn btn-primary" data-test="btn-place-order">Place Order</button>
            </form>
        </div>
    </main>

    <footer class="site-footer" data-test="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <a href="https://svcollege.co.il/" target="_blank" rel="noopener noreferrer"><img src="../assets/SVCollege_logo.png" alt="SV College" class="footer-logo-img" /></a>
          <span>SV College</span>
        </div>
        <p class="footer-copy">&copy; 2026 All rights reserved.</p>
        <a href="../accessibility.html" class="footer-accessibility" title="Accessibility Statement" data-test="link-accessibility">
          <i class="fas fa-universal-access"></i>
          <span>Accessibility</span>
        </a>
      </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/payment.js"></script>
</body>

</html>
